<!doctype html>
<!--
  transfer-designer.html — the transfer designer page's structure: the header, the deck panel, the
  Stages column and the message bar. The labware, the wells, the Stages column's cards and every
  editing box are created by transfer-designer-page.js, because they change with the plan;
  everything with an id here is looked up by that file. Styling is in transfer-designer.css.
  Specification: transfer-designer-page.md (layout in section 3, look in section 15).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transfer Designer</title>
    <!-- An empty tab icon, so the browser doesn't ask the server for one that doesn't exist. -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="transfer-designer.css" />
    <script type="module" src="transfer-designer-page.js"></script>
  </head>
  <body>
    <header class="page-header">
      <!-- The experiment's name is the page's heading (section 5): transfer-designer-page.js fills
           it with a button showing the name, which becomes a text box when clicked. The tool's name
           isn't shown on the page, only in the browser tab. -->
      <h1 id="experiment-heading"></h1>
      <!-- The header's buttons (section 5). Biomek files and Reset each open a small box under
           them. -->
      <div class="header-actions">
        <div class="box-holder">
          <button id="biomek-files" class="primary" type="button" aria-haspopup="dialog" aria-expanded="false">Biomek files</button>
          <div id="biomek-box" class="confirm-box biomek-box" role="dialog" aria-labelledby="biomek-heading" hidden>
            <h3 id="biomek-heading">Write the Biomek files?</h3>
            <!-- What Write files will save, or the file writer's message; filled when the box opens. -->
            <p id="biomek-summary"></p>
            <div class="confirm-buttons">
              <button id="biomek-cancel" class="action" type="button">Cancel</button>
              <button id="write-files" class="primary" type="button">Write files</button>
            </div>
          </div>
        </div>
        <button id="save" class="action" type="button">Save</button>
        <button id="open" class="action" type="button">Open</button>
        <input id="open-file" type="file" accept=".json,application/json" hidden />
        <div class="box-holder">
          <button id="reset" class="danger-outline" type="button" aria-haspopup="dialog" aria-expanded="false">Reset</button>
          <div id="reset-box" class="confirm-box" role="dialog" aria-labelledby="reset-heading" hidden>
            <h3 id="reset-heading">Reset the whole plan?</h3>
            <p>This clears the starting contents, every transfer, every stage and every well's name. Undo can bring them back.</p>
            <div class="confirm-buttons">
              <button id="reset-cancel" class="action" type="button">Cancel</button>
              <button id="reset-everything" class="danger" type="button">Reset everything</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- The two panels (section 3): the deck on the left, the Stages column on the right; stacked
         in a narrow window. The deck panel's width doesn't depend on what's in it. -->
    <main id="workspace" class="workspace">
      <section id="deck-panel" class="panel deck-panel" aria-labelledby="deck-heading">
        <h2 id="deck-heading" class="visually-hidden">Deck</h2>

        <!-- First bar (section 6): the timeline on the left; Move wells, Undo, Redo and the
             problem count on the right. -->
        <div class="deck-bar">
          <div class="timeline">
            <button id="previous-point" class="action small-button" type="button" aria-label="Open the entry before">‹</button>
            <button id="next-point" class="action small-button" type="button" aria-label="Open the entry after">›</button>
            <span id="timeline-caption" class="timeline-caption"></span>
          </div>
          <div class="deck-bar-right">
            <!-- Starts and ends moving wells (section 6); reads Done while it's on. -->
            <button id="move-wells" class="action move-wells" type="button" aria-pressed="false">Move wells</button>
            <button id="undo" class="action" type="button">Undo</button>
            <button id="redo" class="action" type="button">Redo</button>
            <span id="problem-count" class="problem-count"></span>
          </div>
        </div>

        <!-- Second bar (section 6): the labware tray on the left; the key, then the Names and Arrows
             toggles, on the right. -->
        <div class="deck-bar tray-bar">
          <div id="labware-tray" class="tray"></div>
          <div class="deck-bar-right">
            <ul id="key" class="key" aria-label="Key"></ul>
            <button id="names-toggle" class="action" type="button" aria-pressed="true" title="Show well names instead of volumes on named wells">Names</button>
            <button id="arrows-toggle" class="action" type="button" aria-pressed="true">Arrows</button>
          </div>
        </div>

        <!-- Third bar (section 6): the component colors, from the left; hidden while the plan has no
             components. -->
        <div id="components-bar" class="components-bar" hidden>
          <span class="components-label">Components:</span>
          <ul id="component-colors" class="component-colors" aria-label="Component colors"></ul>
        </div>

        <!-- While moving wells (section 6): what to do, above the labware; filled by
             transfer-designer-page.js, and announced to screen readers when it changes. -->
        <div id="moving-bar" class="moving-bar" role="status" aria-live="polite" hidden></div>

        <!-- The labware that's out, one block each; the arrows are drawn over the whole panel. -->
        <div id="labware-area" class="labware-area">
          <p id="no-labware-note" class="note">
            No labware is out. Click a labware above to bring it into the editor.
          </p>
        </div>
        <svg id="arrow-layer" class="arrow-layer" aria-hidden="true"></svg>
      </section>

      <aside id="stages-column" class="panel stages-column" aria-labelledby="stages-heading">
        <h2 id="stages-heading" class="visually-hidden">Stages</h2>
        <div id="stages-list" class="stages-list"></div>
      </aside>
    </main>

    <!-- The version line (section 3): the tool's name and the build's version, filled in by
         transfer-designer-page.js. Plain text, so it can be selected and copied. -->
    <p class="version-line">Transfer Designer <span id="page-version"></span></p>

    <!-- The message bar (section 12), the cursor's label and the contents card (sections 6 and 12)
         float over the page. -->
    <div id="message-bar" class="message-bar" role="status" aria-live="polite" hidden></div>
    <div id="cursor-label" class="cursor-label" aria-hidden="true" hidden></div>
    <div id="contents-card" class="contents-card" role="tooltip" hidden></div>
    <!-- Moving and copying in the Stages column (section 7): the drag's label, the drop line, and
         the right-click menu. -->
    <div id="drag-label" class="drag-label" aria-hidden="true" hidden></div>
    <div id="drop-line" class="drop-line" aria-hidden="true" hidden></div>
    <div id="column-menu" class="column-menu" role="menu" aria-label="Stages" hidden></div>
    <!-- The transfer table wizard (section 7): a dialog over the page, its backdrop dimming the
         page; filled by transfer-designer-page.js while it's open. -->
    <div id="wizard-backdrop" class="wizard-backdrop" hidden>
      <div id="wizard" class="wizard" role="dialog" aria-modal="true" aria-labelledby="wizard-title"></div>
    </div>
  </body>
</html>
